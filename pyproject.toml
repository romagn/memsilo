[project]
name = "memsilo"
version = "0.1.1"
description = "memsilo — multi-user memory MCP server with per-user access"
authors = [
    {name = "memsilo contributors"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "mcp[cli] (>=2.1.1,<2.2)",
    "mem0ai (>=2.0.20,<2.1)",
    "qdrant-client[fastembed] (>=1.9.0,<2.0.0)",
    "anthropic (>=0.85.0,<0.86.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "pyyaml (>=6.0,<7.0)",
    # mcp_server.py imports starlette.* and uvicorn directly (the remote
    # transports build and serve their own Starlette app), so they are direct
    # dependencies — not merely transitive ones via mcp[cli].
    "starlette (>=1.6.0)",
    "uvicorn (>=0.52.4)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.test.dependencies]
pytest = ">=8.0,<9.0"
pytest-asyncio = ">=0.24,<1.0"
pytest-cov = ">=6.0,<7.0"
httpx = ">=0.27,<1.0"
ruff = ">=0.8,<1.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# starlette.testclient still names the deprecated anyio alias; nothing to fix on
# our side. Only this exact message is silenced.
filterwarnings = [
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
