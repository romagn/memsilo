name: CI

# Every push and pull request runs the checks and builds the image. Only a version
# tag (v1.2.3) pushes it to Docker Hub, using two repository secrets:
# DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (an access token with write access).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, Test & Validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install poetry
        run: pip install poetry==2.5.1

      - name: Install dependencies
        run: poetry install

      - name: Ruff lint
        run: poetry run ruff check .

      - name: Ruff format check
        run: poetry run ruff format --check .

      - name: Run tests
        run: poetry run pytest tests/ -v --tb=short

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  image:
    name: Build and publish image
    needs: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: memsilo:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke check (no network, non-root)
        run: |
          test "$(docker run --rm --network none memsilo:ci id -u)" = "10001"
          docker run --rm --network none memsilo:ci python -c "import mcp_server"

      - name: Log in to Docker Hub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image tags
        if: startsWith(github.ref, 'refs/tags/v')
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/memsilo
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Push the image
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
